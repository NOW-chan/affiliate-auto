# 1日4回、はてなで公開された記事を検知し、SNS文面を作って投稿する
name: sns-post

on:
  schedule:
    - cron: "0 0,3,9,12 * * *"   # 日本時間 9:00 / 12:00 / 18:00 / 21:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "SNSに投稿せず、文面の生成と表示だけ行う"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: affiliate-pipeline
  cancel-in-progress: false

jobs:
  sns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      X_ENABLED: ${{ vars.X_ENABLED || 'false' }}
      X_INCLUDE_LINK: ${{ vars.X_INCLUDE_LINK || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt

      - name: Check published on Hatena
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: python scripts/check_published.py

      - name: Generate SNS text & post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python scripts/cases.py list --status published > targets.txt
          if [ ! -s targets.txt ]; then echo "新しく公開された記事はありません"; exit 0; fi
          while read -r ID; do
            [ -z "$ID" ] && continue
            if [ ! -f "articles/$ID/sns.yaml" ]; then
              claude -p "CLAUDE.md と .claude/skills/write-sns-post/SKILL.md を読み、
              articles/${ID}/ の記事の告知文を articles/${ID}/sns.yaml に作成してください。
              X_INCLUDE_LINK=${X_INCLUDE_LINK} です。cases.yaml と scripts/ は編集しないでください。" \
                --allowedTools "Read,Write,Edit,Glob,Grep" \
                --max-turns 15 > /dev/null
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python scripts/post_sns.py "$ID" --dry-run
            else
              python scripts/post_sns.py "$ID"
            fi
          done < targets.txt

      - name: Commit state
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles cases.yaml
          git commit -m "sns: update state" || exit 0
          git pull --rebase --autostash && git push
